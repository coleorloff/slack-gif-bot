display_information:
  name: GIF Bot
  description: React with 🎞️ or ✂️ on any video to generate an optimized GIF in the thread, with interactive Clip & Resize controls.
  background_color: "#111111"
features:
  bot_user:
    display_name: GIF Bot
    always_online: true
  shortcuts:
    - name: "✂️ Clip / Make GIF"
      type: message
      callback_id: clip_video_to_gif
      description: Select a time range and dimensions to convert a video clip into an optimized GIF.
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - commands
      - files:read
      - files:write
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    request_url: https://YOUR-CLOUD-RUN-SERVICE-URL.run.app/slack/events
    bot_events:
      - reaction_added
  interactivity:
    is_enabled: true
    request_url: https://YOUR-CLOUD-RUN-SERVICE-URL.run.app/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
